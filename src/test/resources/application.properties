# H2 in-memory database configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Automatically create and drop the schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed test credentials so tests never depend on the developer's environment
jwt.secret=test-only-secret-value-at-least-32-chars-long
jwt.expiration-minutes=60
app.admin-usernames=
app.cors.allowed-origins=http://localhost:3000
jdoodle.clientId=test
jdoodle.clientSecret=test
