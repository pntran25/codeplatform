spring.application.name=codeplatform

# Load ./.env (KEY=value lines) as properties so no shell export step is needed. Both paths are
# tried so it works whether the working directory is this folder or its parent.
spring.config.import=optional:file:./.env[.properties],optional:file:./codeplatform/.env[.properties]

# === DATASOURCE ===
# Credentials come from the environment. Copy .env.example, fill it in, and export it
# (or set these variables in your IDE's run configuration) before starting the app.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codeplatform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# === HIBERNATE / JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === SECURITY ===
# Must be at least 32 characters (HS256 needs 256 bits of key material).
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Usernames granted the ADMIN role at registration time, comma separated.
app.admin-usernames=${ADMIN_USERNAMES:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# === Dev Tools Hot Reload ===
spring.devtools.restart.enabled=true

# === JDoodle code execution API (https://www.jdoodle.com/compiler-api) ===
jdoodle.clientId=${JDOODLE_CLIENT_ID:}
jdoodle.clientSecret=${JDOODLE_CLIENT_SECRET:}
